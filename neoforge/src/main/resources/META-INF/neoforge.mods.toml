license="${license}"
issueTrackerURL="${source_link}/issues"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    description='''${description}'''
    displayURL="${cf_link}"
    logoFile="assets/${mod_id}/icon.png"
    authors="${mod_author}"

[[mixins]]
    config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

