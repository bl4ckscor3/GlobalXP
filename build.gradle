plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.12.1'
group = 'bl4ckscor3.mod.globalxp'

base {
	archivesName = 'globalxp-neoforge-26.1.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

processResources {
	exclude ".cache"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

neoForge {
	version = "26.1.1.10-beta"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("runs/" + name)
			ideName = "GlobalXP " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}

		data {
			clientData()
			programArguments.addAll('--mod', 'globalxp', '--all', '--output', file('src/generated/resources/').getAbsolutePath())
		}
	}

	mods {
		globalxp {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
    maven {
    	url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
		}
	}
}

dependencies {
	implementation "curse.maven:jade-324717:7817285"
	//implementation "curse.maven:the-one-probe-245211:5502323"
	implementation "curse.maven:wthit-forge-455982:7880673"
	implementation "curse.maven:badpackets-615134:7878544" //wthit dependency
}

tasks.named('jar', Jar).configure {
	exclude('bl4ckscor3/mod/globalxp/datagen/**') //exclude files from the built jar that are only used to generate the assets & data

    manifest {
        attributes(["Specification-Title": "Global XP",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Global XP",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 25
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}