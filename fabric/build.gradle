plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
    maven {
        url "https://maven.terraformersmc.com/releases"
        content {
            includeGroup "com.terraformersmc"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation project(":common")
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}"
    implementation "curse.maven:jade-324717:${fabric_jade_version}"
    implementation "curse.maven:wthit-440979:${fabric_wthit_version}"
    implementation "curse.maven:badpackets-615134:${fabric_badpackets_version}" //wthit dependency
}

loom {
    accessWidenerPath.set(project(':common').file("src/main/resources/${mod_id}.accesswidener"))

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir("${run_dir}/client")
        }

        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir("${run_dir}/server")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}
